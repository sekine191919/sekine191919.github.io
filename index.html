<h1 style="font-size:28px; color:magenta;"> <!-- タイトル -->
カオスノイズよりフラクタル抽出が意識化
</h1>

<p style="font-size:14px; color:#512DD3;"> <!-- 本文 -->
GitHub Pages をブラウザ上で編集する際、現在の Web エディタでは「コード編集」と「差分確認」はできますが、実際の公開ページに近い見た目を、その場で確認しながら編集することが難しいです。
</p>

<p style="font-size:14px; color:#512DD3;"> <!-- 意見 -->
そのため、保存前でもページの出来栄えを確認できるライブプレビュー機能が必要だと考えます。
</p>

</body> <!-- 本文終了 -->
