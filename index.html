カオスノイズよりフラクタル抽出が意識化
</h1>

<p style="font-size:14px; color:#512DD3;">
我々の意識は混沌たる一つの泉から掬い上げられた一部に過ぎない。
しかし常に無意識はその宇宙と一体である。
</p>

<p style="font-size:14px; color:#512DD3;">
同様に、編集という行為もまた混沌の中から形を抽出する過程である。
その過程において、結果の姿を即座に視覚化できるエディターは不可欠である。
GitHubのWebエディターには、ページの出来栄えを見ながら編集できるプレビュー機能が必要である。
</p>
